name: Build Windows packages

# Run by hand: GitHub > Actions > "Build Windows packages" > Run workflow.
# Produces: installer .exe, unsigned Store .msix, Store logos, and the WACK report.
on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: "Store Identity Name from Partner Center"
        default: "Smartupworld.SDrop"
      publisher:
        description: "Store Publisher (CN=...) from Partner Center"
        default: "CN=A10ED12C-0499-4FBE-8193-87C74DAFC0BB"
      publisher_display_name:
        description: "Store PublisherDisplayName"
        default: "Smartupworld"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- Direct-download installer (Inno Setup) ----
      - name: Bundle app + build installer
        shell: pwsh
        run: |
          python -m pip install --upgrade PyQt6 pyinstaller pillow
          python -m PyInstaller --clean --noconfirm --onedir --windowed --name SDrop --icon sdrop.ico --hidden-import=PyQt6.sip sdrop.py
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" sdrop_setup.iss
          New-Item staging -ItemType Directory -Force | Out-Null
          Copy-Item installer_output\*.exe staging\
          Compress-Archive -Path dist\SDrop\* -DestinationPath staging\SDrop-v2.0.0-Portable.zip

      # ---- Test MSIX (throw-away certificate) + WACK ----
      - name: Build signed test MSIX
        shell: pwsh
        run: ./Packaging/build-msix.ps1
      - name: Run Windows App Certification Kit
        shell: pwsh
        continue-on-error: true
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          $msix = (Get-ChildItem dist\*.msix | Select-Object -First 1).FullName
          & $appcert reset
          & $appcert test -appxpackagepath $msix -reportoutputpath "$PWD\wack-report.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WACK-report
          path: wack-report.xml
          if-no-files-found: warn

      # ---- Unsigned MSIX for Partner Center (Store signs it) ----
      - name: Build Store MSIX
        shell: pwsh
        run: ./Packaging/build-msix.ps1 -Store -IdentityName "${{ inputs.identity_name }}" -Publisher "${{ inputs.publisher }}" -PublisherDisplayName "${{ inputs.publisher_display_name }}"
      - name: Collect Store files
        shell: pwsh
        run: |
          Copy-Item (Get-ChildItem dist\*.msix | Select-Object -First 1).FullName staging\SDrop-Store.msix
          Compress-Archive -Path dist\store-logos\* -DestinationPath staging\SDrop-store-logos.zip
          if (Test-Path wack-report.xml) { Copy-Item wack-report.xml staging\ }

      # ---- Fixed "latest" release: same download link every time ----
      - name: Update latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest --prerelease --target ${{ github.sha }} --title "Latest build" --notes "Installer, portable ZIP, unsigned Store package and Store logos (commit ${{ github.sha }})." (Get-ChildItem staging\* | ForEach-Object { $_.FullName })
          exit 0
